[package]
name = "spotcore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "librespot-based Spotify engine exposed to the Android app over JNI"

[lib]
crate-type = ["cdylib", "rlib"]

# librespot crates are pinned exactly: core, connect and playback are vendored and patched
# (see ../vendor/README.md); the others must match their 0.8.0 APIs.
[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "=0.8.0", default-features = false, features = ["with-libmdns"] }
librespot-protocol = "=0.8.0"

jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
hex = "0.4"
bytes = "1"
http = "1"
http-body-util = "0.1"
url = "2"
percent-encoding = "2"
form_urlencoded = "1.2"
base64 = "0.22"
rand = { version = "0.9", features = ["small_rng"] }
uuid = { version = "1", features = ["v4"] }
lru = "0.12"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
# Spotify Connect ZeroConf client (`zeroconf_client`): the same crypto crates and versions that
# librespot-core / librespot-discovery use, and a plain HTTP/1.1 client for LAN devices.
aes = "0.8.4"
ctr = "0.9.2"
hmac = "0.12.1"
sha1 = "0.10.7"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
# Google Cast client (`cast_client`): TLS to the Cast device with the rustls/ring stack librespot
# already uses (no aws-lc-rs); md-5 for the Connect device id a Cast receiver registers under.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
md-5 = "0.10.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[build-dependencies]
protobuf-codegen = "3.7"
# librespot-core 0.8.0's build script breaks with vergen 9.1 (vergen-lib 9 vs 0.1); pin the
# whole graph to the last compatible release. Not used by our build script.
vergen = { version = "=9.0.6", default-features = false }

[dev-dependencies]
# test-util: tests of the audio-key pacing run on tokio's paused clock.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
